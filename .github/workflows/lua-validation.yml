name: ToneCustoms Lua Validation

on:
  workflow_call:
    inputs:
      lua-version:
        description: Lua version used by the resource
        required: false
        type: string
        default: '5.4'

permissions:
  contents: read

jobs:
  lua-syntax:
    name: Validate Lua syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ inputs.lua-version }}

      - name: Compile-check Lua files
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f -name '*.lua' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print0)

          if (( ${#files[@]} == 0 )); then
            echo "No Lua files found; nothing to validate."
            exit 0
          fi

          echo "Checking ${#files[@]} Lua files..."
          for file in "${files[@]}"; do
            echo "Checking: $file"
            luac -p "$file"
          done
